name: Observability & Performance Check

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  metrics-analysis:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: agprueba
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Boot Backend & Check Health
        run: |
          cd authorization-server 
          chmod +x mvnw
          ./mvnw spring-boot:run &
          echo "Esperando a que arranque el servidor..."
          timeout 120s bash -c 'until curl -s http://localhost:9000/actuator/health | grep UP; do sleep 5; done'
          echo "Backend UP. Obteniendo métricas..."
          curl -s http://localhost:9000/actuator/metrics > backend_metrics.json
          curl -s http://localhost:9000/actuator/health > backend_health.json

      - name: Install k6
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.46.0/k6-v0.46.0-linux-amd64.tar.gz -L | tar xvz --strip-components 1

      - name: Run API Performance Test
        run: |
          echo "import http from 'k6/http'; import { check } from 'k6'; export default function () { const res = http.get('http://localhost:9000/actuator/health'); check(res, { 'status is 200': (r) => r.status === 200, 'duration < 200ms': (r) => r.timings.duration < 200 }); }" > loadtest.js
          ./k6 run loadtest.js --iterations 50 --summary-export=api_perf_report.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build & Audit Frontend
        run: |
          cd ag-prueba-front
          npm install
          npm run build
          npm install -g http-server @lhci/cli
          npx http-server ./dist/ag-prueba-front/browser -p 8080 &
          sleep 5
          npx lhci healthcheck --fatal=false || echo "Lighthouse audit running..."
          npx lhci collect --url=http://localhost:8080 --numberOfRuns=1

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-reports
          path: |
            authorization-server/backend_health.json
            api_perf_report.json
            ag-prueba-front/.lighthouseci/
