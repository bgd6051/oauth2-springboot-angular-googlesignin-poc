name: SonarQube Analysis
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. JAVA: COMPILAR Y TESTEAR (Genera binarios y coverage)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "zulu"
          cache: "maven"

      - name: Build & Test Authorization Server
        run: |
          cd authorization-server
          chmod +x mvnw
          ./mvnw clean verify

      - name: Build & Test Resource Server
        run: |
          cd resource-server
          chmod +x mvnw
          ./mvnw clean verify

      # 2. NODE: TESTEAR FRONTEND (Genera coverage y linting)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: ag-prueba-front/package.json

      - name: Lint Frontend
        run: |
          cd ag-prueba-front
          npm run lint

      - name: Test Frontend
        run: |
          cd ag-prueba-front
          npm install
          npm run test:ci

      # 3. SONARCLOUD SCAN
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
