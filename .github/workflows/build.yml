name: SonarQube Analysis
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. SETUP JAVA Y TESTS BACKEND
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "zulu"
          cache: "maven"

      - name: Test Authorization Server (Generate JaCoCo)
        run: |
          cd authorization-server
          chmod +x mvnw
          ./mvnw clean test

      - name: Test Resource Server (Generate JaCoCo)
        run: |
          cd resource-server
          chmod +x mvnw
          ./mvnw clean test

      # 2. SETUP NODE Y TESTS FRONTEND
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: ag-prueba-front/package.json

      - name: Install dependencies and Test Frontend
        run: |
          cd ag-prueba-front
          npm install
          npm run test:ci

      # 3. ANÁLISIS DE SONARCLOUD (Unificado)
      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd authorization-server
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=bgd6051_oauth2-springboot-angular-googlesignin-poc \
          -Dsonar.organization=bgd6051 \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.modules=.,../resource-server,../ag-prueba-front \
          -Dsonar.java.binaries=target/classes \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,../resource-server/target/site/jacoco/jacoco.xml \
          -Dsonar.javascript.lcov.reportPaths=../ag-prueba-front/coverage/lcov.info \
          -Dsonar.sources=src/main/java,../resource-server/src/main/java,../ag-prueba-front/src
