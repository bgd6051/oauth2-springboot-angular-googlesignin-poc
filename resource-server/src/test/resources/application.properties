# ==========================================
# 1. Configuración de Base de Datos (H2)
# ==========================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# ==========================================
# 2. Configuración Mock de OAuth2
# ==========================================
spring.security.oauth2.client.registration.google-idp.provider=google
spring.security.oauth2.client.registration.google-idp.client-id=test-client-id
spring.security.oauth2.client.registration.google-idp.client-secret=test-client-secret
spring.security.oauth2.client.registration.google-idp.scope=openid,profile,email
spring.security.oauth2.client.registration.google-idp.client-name=test-app
spring.security.oauth2.client.registration.google-idp.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google-idp.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=email
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000